# ticket-os dashboard on the hetzner Swarm (Komodo Stack hetzner_ticket-os, see komodo.toml).
# APP_IMAGE comes from komodo.sh: the image the Komodo Build left on this same server.
# The secrets come from the Stack's compose_cmd_wrapper (Komodo Variables), never from a .env.
# Caddy (config) reaches the service as hetzner_ticket-os_app:3000 over the edge network; the
# route is ticket-os.caddy, published by route.sh.
#
# Local development keeps using ticket-os/dashboard/.config/docker/compose.yml.
services:
  app:
    image: ${APP_IMAGE:?}
    environment:
      - NODE_ENV=production
      - API_PORT=3000
      - API_LOG_LEVEL=info
      - API_CORS_ORIGIN=https://ticket-os.vinicius-gpl.com
      # One proxy in front of the API: the server's Caddy (see server/.env.example).
      - API_TRUST_PROXY_HOPS=1
      - DATABASE_URL=${DATABASE_URL:?}
      - DATABASE_SCHEMA=public
      - NEON_AUTH_URL=${NEON_AUTH_URL:?}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:?}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:?}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:?}
      - R2_BUCKET=${R2_BUCKET:?}
      # The WhatsApp bot starts in the same container when both are set (see the dockerfile CMD).
      - BOT_API_TOKEN=${BOT_API_TOKEN:?}
      - BOT_SESSION_KEY=${BOT_SESSION_KEY:?}
      - BOT_LOG_LEVEL=info
    volumes:
      # The bot's encrypted WhatsApp connections.
      - bot-data:/data
    networks:
      - edge
    # /api/health only answers 200 once the database is reachable; start_period covers the
    # migrations the server applies on startup.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      # stop-first: the bot keeps one WhatsApp session per number, so two tasks can't run at once.
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 60s
      rollback_config:
        parallelism: 1
        order: stop-first
      labels:
        app: ticket-os
        server: hetzner

volumes:
  bot-data:

networks:
  edge:
    external: true
